plugins {
    id 'java'
    id 'application'
    id 'idea'
    id 'org.jetbrains.kotlin.jvm' version '2.2.20'
    id "org.jetbrains.kotlin.kapt" version "2.2.20"
//    id 'org.jetbrains.kotlin.plugin.serialization' version '2.2.20'
}

group = 'com.bolyartech.forge.server.test'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
//    mavenLocal()
}

kapt { correctErrorTypes = true }

ext.daggerVersion = '2.59.1'

dependencies {
//    implementation 'com.bolyartech.forge.server:forge-server-jetty:23.0.0'
    implementation project(':forge-server-jetty')
    implementation "org.postgresql:postgresql:42.7.8"
    implementation 'org.slf4j:slf4j-api:2.0.3'
    implementation 'ch.qos.logback:logback-classic:1.5.19'
    implementation "com.google.dagger:dagger:$daggerVersion"
    kapt "com.google.dagger:dagger-compiler:$daggerVersion"
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.10.0")

    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

test {
    useJUnitPlatform()
}

tasks.distTar.enabled = false

kotlin {
    jvmToolchain(17)
}

application {
    mainClass = 'com.bolyartech.forge.test.ServerStarterKt'
}


tasks.register('copyStatic', Copy) {
    from("src/main/static/")
    into("$buildDir/static")
}

tasks.distTar.enabled = false

distributions {
    main {
        contents {
            from(copyStatic) {
                into("static")
            }
        }
    }
}

